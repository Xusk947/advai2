version: "3.9"

services:
  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    volumes:
      - checkpoints:/app/checkpoints
    environment:
      - PYTHONUNBUFFERED=1

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    depends_on:
      - train
    # общий volume с чекпоинтами, чтобы UI читал весы, которые пишет train
    volumes:
      - checkpoints:/app/checkpoints
      # проброс X11-сокета хоста для вывода pygame-окна
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=${DISPLAY}

volumes:
  checkpoints:

